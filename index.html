<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Da3wa</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- al shasha al awla: el envelope w 3leha al poster malyn al shasha kolha -->
    <div id="envelope-screen" class="screen">
        <div class="envelope-container" id="envelope-box">
            <!-- video fth el envelope -->
            <video id="envelope-video" playsinline webkit-playsinline>
                <source src="opening.mp4" type="video/mp4">
            </video>
            
            <!-- sora al poster btshta8l k wgah w tmla al shasha -->
            <img src="poster.jfif" alt="Poster" id="envelope-poster">
            
          
        </div>
    </div>

    <!-- al shasha al tanya: al safha al awla (video) -->
    <div id="first-page-screen" class="screen hidden">
        <video id="main-video" playsinline webkit-playsinline>
            <source src="firstpage.mp4" type="video/mp4">
        </video>
    </div>

    <script src="script.js"></script>
</body>
</html>
