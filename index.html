<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Royal Wedding</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 1. شاشة الظرف (ثابتة في الأول لحد ما تدوسي عليها) -->
    <div id="envelope-screen" class="envelope-screen">
        <div class="envelope-container" id="envelope-box">
            <video id="envelope-video" playsinline webkit-playsinline>
                <source src="opening.mp4" type="video/mp4">
            </video>
            <img src="poster.jfif" alt="Poster" id="envelope-poster">
        </div>
    </div>

    <!-- 2. الصفحة الطويلة اللي هتعملي فيها scroll براحتك (فيها الفيديو وتحته الصورة) -->
    <div id="main-scroll-page" class="scroll-page hidden">
        
        <!-- قسم الفيديو الأول -->
        <div class="video-section">
            <video id="main-video" autoplay loop muted playsinline webkit-playsinline>
                <source src="firstpage.mp4" type="video/mp4">
            </video>
        </div>

        <!-- قسم الصورة تحته مباشرة (تظهر وأنتِ بتعملي scroll) -->
        <div class="image-section">
            <img src="secondp.jfif" alt="Second Page Invitation" class="full-width-image">
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
